# Supabase yerel/deploy yapılandırması.
#
# Bu dosya olmadan JWT muafiyeti dağıtım komutundaki bir bayrağa bağlıydı
# (`--no-verify-jwt`). Bir sonraki dağıtımda unutulduğunda iyzico callback'i
# 401 alıp ödeme akışı sessizce kırılırdı. Karar artık repoda yazılı.
#
# 2026-09-08: dört uç emekli edildi ve girdileri buradan kalktı —
# `photo-check`, `listing-value`, `avatar-check` (üçü Gemini'ye giden yapay
# zekâ denetimi; ilan ve avatar onayı artık yönetici panelinde insan
# tarafından veriliyor) ve `cargo-payment-init` (alıcı artık kargo bedeli
# ödemiyor, kargoyu satıcı kendi gönderiyor). Klasörleri de silindi; git
# geçmişinde duruyorlar. Yayında birer 410 taslağı ile üstlerine yazıldı,
# panelden kaldırılmaları bekleniyor.
#
# Buradan bir ders kalıyor ve yeni bir uç yazılırken geçerli: **`verify_jwt`
# sahiplik doğrulamaz.** Yalnızca *birinin* giriş yaptığını kanıtlar, gelen
# kimliğin çağırana ait olduğunu değil — ve fonksiyon `service_role` ile
# çalıştığı için RLS de devrede olmaz. Sahiplik kontrolü fonksiyonun içinde
# `auth.getUser()` ile yapılır; `verify_jwt = true` onun yerine geçmez.

project_id = "kids-trade"

[functions.iyzico-callback]
# iyzico bir Supabase oturumu taşıyamaz; bu uç JWT'siz olmak ZORUNDA.
# Güvenlik iki şeye dayanır: token'ın gizliliği ve sonucun iyzico'ya
# RETRIEVE ile doğrulanması. Gövdeye asla güvenilmez.
#
# 2026-09-08'den beri takasa dokunmuyor; kredi kartıyla puan satışı için
# yuva (nereden satılacağı kararlaştırılmadı). Bkz. fonksiyonun başındaki not.
verify_jwt = false

[functions.send-sms]
# Supabase Auth Hook'u çağırır; imza doğrulaması fonksiyonun içindedir.
verify_jwt = false
