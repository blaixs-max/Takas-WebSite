# Supabase yerel/deploy yapılandırması.
#
# Bu dosya olmadan JWT muafiyeti dağıtım komutundaki bir bayrağa bağlıydı
# (`--no-verify-jwt`). Bir sonraki dağıtımda unutulduğunda iyzico callback'i
# 401 alıp ödeme akışı sessizce kırılırdı. Karar artık repoda yazılı.

project_id = "kids-trade"

[functions.cargo-payment-init]
# Çağıran oturumlu bir kullanıcı olmalı; fonksiyon ayrıca çağıranın takasın
# alıcısı olduğunu kendi içinde doğrular.
verify_jwt = true

[functions.iyzico-callback]
# iyzico bir Supabase oturumu taşıyamaz; bu uç JWT'siz olmak ZORUNDA.
# Güvenlik iki şeye dayanır: token'ın gizliliği ve sonucun iyzico'ya
# RETRIEVE ile doğrulanması. Gövdeye asla güvenilmez.
verify_jwt = false

[functions.photo-check]
# Kareyi yükleyen kullanıcı çağırır; oturum zorunlu.
#
# DİKKAT: bu satır tek başına yetmiyor ve bir tur boyunca yettiği sanıldı.
# verify_jwt yalnızca *birinin* giriş yaptığını kanıtlar, gelen photoId'nin
# sahibi olduğunu değil — üstelik fonksiyon service_role ile çalıştığı için
# RLS de devrede değil. Sahiplik kontrolü fonksiyonun içinde, auth.getUser()
# ile çözülen çağıranın products.seller_id ile karşılaştırılmasıyla yapılıyor.
# İkisi birden gerekli; bu satırı kaldırmak kimliği tamamen düşürür.
verify_jwt = true

[functions.send-sms]
# Supabase Auth Hook'u çağırır; imza doğrulaması fonksiyonun içindedir.
verify_jwt = false

[functions.listing-value]
# İlan sahibi çağırır; oturum zorunlu. Aynı uyarı photo-check'te olduğu gibi
# burada da geçerli: verify_jwt yalnızca birinin giriş yaptığını kanıtlar,
# bu ilanın sahibi olduğunu değil. Sahiplik kontrolü fonksiyonun içinde,
# products.seller_id ile karşılaştırılarak yapılıyor. İkisi birden gerekli.
verify_jwt = true
